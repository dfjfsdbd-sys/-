<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>المذاكرات</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#0b0b0f;--s1:#14141b;--s2:#1b1b24;--s3:#23232e;--line1:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);--ink1:#e6e6ec;--ink2:#a0a0ae;--ink3:#6e6e7d;--accent:#4cb8d4;--at:rgba(76,184,212,.12);--grad:linear-gradient(140deg,#4aaec4,#3a6db0);--warn:#e0a04a;--good:#35b791}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink1);font-size:14px;line-height:1.6;min-height:100vh;
  background:var(--bg);background-image:radial-gradient(600px 300px at 100% -5%,rgba(76,184,212,.14),transparent 62%),radial-gradient(500px 280px at 0% 0%,rgba(63,124,196,.1),transparent 60%);background-repeat:no-repeat}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 30px}
.hd{display:flex;align-items:center;gap:12px;padding:22px 2px 10px}
.logo{width:48px;height:48px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#0b0b0f;font-size:20px;box-shadow:0 10px 24px rgba(63,124,196,.3);flex-shrink:0}
.hd b{font-size:19px;font-weight:600;display:block;line-height:1.35}.hd small{font-size:11.5px;color:var(--ink3)}
.next{display:flex;align-items:center;gap:8px;margin:6px 0 12px;padding:10px 13px;border-radius:15px;background:rgba(242,166,90,.08);border:1px solid rgba(242,166,90,.28);font-size:12.5px}
.next span{color:var(--ink3)}.next em{font-style:normal;margin-inline-start:auto;color:var(--warn);font-weight:600}
.fc{position:relative;border-radius:22px;overflow:hidden;margin-bottom:9px;border:1px solid var(--line1);background:var(--s1);transition:border-color .2s,box-shadow .2s}
.fc::before{content:'';position:absolute;inset-block:0;right:0;width:4px;background:var(--c)}
.fc.past{opacity:.55}
.fc.open{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.top{width:100%;display:flex;align-items:stretch;gap:12px;padding:12px;border:0;background:none;text-align:start}
.dd{display:grid;justify-items:center;align-content:center;min-width:60px;padding:6px 4px;border-radius:15px;background:color-mix(in srgb,var(--c) 13%,var(--s2));line-height:1.25;text-align:center;flex-shrink:0}
.dd b{font-size:24px;font-weight:600;color:var(--c)}.dd small{font-size:10.5px;color:var(--ink2)}.dd span{font-size:10px;color:var(--ink3)}
.mid{flex:1;min-width:0;display:grid;gap:4px;align-content:center}
.tt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tt b{font-size:15px;font-weight:600}
.pt{font-size:10px;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.mid>small{color:var(--ink2);font-size:12px}
.qs{display:flex;gap:5px;flex-wrap:wrap}.qs span{font-size:10px;padding:1px 8px;border-radius:999px;background:var(--s2);border:1px solid var(--line1);color:var(--ink2);display:inline-flex;gap:4px;align-items:center}.qs i{color:var(--ink3);font-size:9px}
.av{width:48px;height:48px;border-radius:14px;align-self:center;flex-shrink:0;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:18px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 30%,#0b0b0f))}
.av img{width:100%;height:100%;object-fit:cover}
.left{font-size:10.5px;color:var(--warn);font-weight:600;white-space:nowrap}
.bd{display:none;padding:10px 12px 12px;border-top:1px solid var(--line1);gap:6px}
.fc.open .bd{display:grid}
.lr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:15px;background:var(--s2);border:1px solid var(--line1)}
.th{width:44px;height:44px;border-radius:12px;flex-shrink:0;overflow:hidden;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.th img{width:100%;height:100%;object-fit:cover}
.lr .in{flex:1;min-width:0}.lr b{font-size:12.5px;font-weight:500;display:block}.lr small{font-size:10px;color:var(--ink3)}
.pdf{font-size:10.5px;font-weight:600;display:inline-flex;gap:5px;align-items:center;padding:5px 11px;border-radius:999px;color:#ff9a9a;background:rgba(238,82,83,.1);border:1px solid rgba(238,82,83,.25);flex-shrink:0}
.memo{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:13px;background:rgba(232,196,106,.07);border:1px dashed rgba(232,196,106,.3);font-size:12px;color:#d9c79a}
.cal{display:flex;justify-content:center;gap:7px;align-items:center;padding:10px;border-radius:13px;background:var(--at);color:var(--accent);font-size:12.5px;font-weight:600}
.none{font-size:12px;color:var(--ink3);padding:4px 2px}
.ft{text-align:center;font-size:11px;color:var(--ink3);padding:14px 0 0;display:flex;gap:6px;justify-content:center;align-items:center}.ft i{color:var(--good)}
.err{margin:40px 0;text-align:center;color:var(--ink2);line-height:1.9}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">عم نفتح المذاكرات…</div></div>
<script>
(function () {
  var MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
  var DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var Q = { mcq: ['أتمتة', 'list-ol'], written: ['كتابي', 'pen'], mixed: ['مختلط', 'shuffle'] };
  var ICONS = { grad: 'graduation-cap', book: 'book', tooth: 'tooth', brain: 'brain', pill: 'pills', bulb: 'lightbulb', feather: 'feather', compass: 'compass' };
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
  function safeImg(u) { return /^data:image\/(png|jpe?g|webp);base64,/i.test(u || '') ? u : ''; }
  function parse(d) { var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function t12(h) { if (!h) return ''; var a = h.split(':'), H = +a[0], m = a[1]; return (H % 12 || 12) + ':' + m + (H < 12 ? ' ص' : ' م'); }
  function count(n, w) { return n === 1 ? w[0] : n === 2 ? w[1] : n <= 10 ? n + ' ' + w[2] : n + ' ' + w[3]; }
  function inDays(n) { return n < 0 ? 'مضت' : n === 0 ? 'اليوم' : n === 1 ? 'بكرة' : 'بعد ' + count(n, ['يوم', 'يومين', 'أيام', 'يوم']); }
  function fromB64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function decode(h) {
    if (!h) return Promise.reject(new Error('empty'));
    var kind = h[0], bytes = fromB64(h.slice(1));
    if (kind === 'j') return Promise.resolve(JSON.parse(new TextDecoder().decode(bytes)));
    if (typeof DecompressionStream !== 'function') return Promise.reject(new Error('old'));
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text().then(JSON.parse);
  }
  function gcal(e) {
    var d = e.d.replace(/-/g, '');
    var dates;
    if (e.h) { var st = d + 'T' + e.h.replace(':', '') + '00'; var end = new Date(parse(e.d).getTime()); var hm = e.h.split(':'); end.setHours(+hm[0], +hm[1] + (e.m || 60)); dates = st + '/' + iso(end).replace(/-/g, '') + 'T' + String(end.getHours()).padStart(2, '0') + String(end.getMinutes()).padStart(2, '0') + '00'; }
    else { var n = new Date(parse(e.d).getTime() + 86400000); dates = d + '/' + iso(n).replace(/-/g, ''); }
    var p = new URLSearchParams({ action: 'TEMPLATE', text: e.k + ': ' + e.s, dates: dates, details: (e.l.length ? count(e.l.length, ['محاضرة وحدة', 'محاضرتين', 'محاضرات', 'محاضرة']) + '\n' + e.l.map(function (l) { return '- ' + l[0]; }).join('\n') : '') + (e.no ? '\n\n' + e.no : ''), location: e.p || '' });
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  }
  function render(data) {
    var now = new Date(); var today = iso(now);
    document.title = data.t || 'المذاكرات';
    var list = (data.x || []).slice().sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    var up = list.filter(function (e) { return e.d >= today; });
    var html = '<div class="hd"><span class="logo"><i class="fa-solid fa-calendar-check"></i></span><div><b>' + esc(data.t || 'المذاكرات') + '</b><small>' + count(list.length, ['مذاكرة وحدة', 'مذاكرتين', 'مذاكرات', 'مذاكرة']) + (data.u ? ' · محدّثة ' + DAYS[parse(data.u).getDay()] + ' ' + parse(data.u).getDate() + ' ' + MONTHS[parse(data.u).getMonth()] : '') + '</small></div></div>';
    if (up.length) { var n0 = Math.round((parse(up[0].d) - parse(today)) / 86400000); html += '<div class="next"><span>أقربها</span><b>' + esc(up[0].s) + '</b><em>' + inDays(n0) + '</em></div>'; }
    list.forEach(function (e, i) {
      var dt = parse(e.d), n = Math.round((dt - parse(today)) / 86400000), c = /^#[0-9a-f]{6}$/i.test(e.c) ? e.c : '#4a9ee0';
      var q = Q[e.q], img = safeImg(e.i);
      var chips = [];
      if (q) chips.push('<span><i class="fa-solid fa-' + q[1] + '"></i> ' + q[0] + (e.n ? ' · ' + e.n + ' سؤال' : '') + '</span>');
      if (e.m) chips.push('<span><i class="fa-regular fa-clock"></i> ' + e.m + ' د</span>');
      if (e.l.length) chips.push('<span><i class="fa-solid fa-layer-group"></i> ' + count(e.l.length, ['محاضرة وحدة', 'محاضرتين', 'محاضرات', 'محاضرة']) + '</span>');
      var lecs = e.l.map(function (l) {
        var li = safeImg(l[2]), pdf = safeUrl(l[1]);
        return '<div class="lr"><span class="th">' + (li ? '<img src="' + li + '" alt="">' : (l[3] || '')) + '</span><div class="in"><b>' + esc(l[0]) + '</b>' + (l[3] ? '<small>محاضرة ' + l[3] + '</small>' : '') + '</div>' + (pdf ? '<a class="pdf" href="' + esc(pdf) + '" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i> PDF</a>' : '') + '</div>';
      }).join('');
      html += '<div class="fc' + (n < 0 ? ' past' : '') + (i === 0 && n >= 0 ? ' open' : '') + '" style="--c:' + c + '">' +
        '<button class="top" type="button"><span class="dd"><b>' + dt.getDate() + '</b><small>' + MONTHS[dt.getMonth()] + '</small><span>' + DAYS[dt.getDay()] + '</span></span>' +
        '<span class="mid"><span class="tt"><span class="pt">' + esc(e.k) + '</span><b>' + esc(e.s) + '</b></span><small>' + [t12(e.h), esc(e.p), '<span class="left">' + inDays(n) + '</span>'].filter(Boolean).join(' — ') + '</small>' + (chips.length ? '<span class="qs">' + chips.join('') + '</span>' : '') + '</span>' +
        '<span class="av">' + (img ? '<img src="' + img + '" alt="">' : '<i class="fa-solid fa-' + (ICONS[e.ic] || 'graduation-cap') + '"></i>') + '</span></button>' +
        '<div class="bd">' + (lecs || '<div class="none">ما انحددت المحاضرات بعد.</div>') + (e.no ? '<div class="memo"><i class="fa-regular fa-note-sticky"></i> ' + esc(e.no) + '</div>' : '') +
        (n >= 0 ? '<a class="cal" href="' + esc(gcal(e)) + '" target="_blank" rel="noopener"><i class="fa-regular fa-calendar-plus"></i> ضيفها لتقويمي</a>' : '') + '</div></div>';
    });
    html += '<div class="ft"><i class="fa-solid fa-seedling"></i> انعملت بتطبيقي</div>';
    app.innerHTML = html;
    Array.prototype.forEach.call(app.querySelectorAll('.fc .top'), function (b) { b.addEventListener('click', function () { b.parentNode.classList.toggle('open'); }); });
  }
  var p = window.SHARE_DATA ? Promise.resolve(window.SHARE_DATA) : decode(location.hash.slice(1));
  p.then(render).catch(function () { app.innerHTML = '<div class="err">ما قدرنا نفتح الرابط.<br>تأكد إنك نسخته كامل، أو اطلب من رفيقك يبعته كملف.</div>'; });
})();
</script>
</body>
</html>
